name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-southeast-2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC pipeline
        run: dvc repro

      - name: Verify DVC outputs
        run: |
          ls -la models
          test -f models/vectorizer.pkl

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Promote model
        run: python src/model/promote_model.py

  docker:
    needs: test
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest

    env:
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull DVC artifacts
        run: dvc pull

      - name: Verify model artifacts
        run: |
          ls -la models
          test -f models/vectorizer.pkl

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: docker build -t div7ansh/emotion-detection:v2 .

      - name: Push Docker image
        run: docker push div7ansh/emotion-detection:v2

  deploy:
    needs: docker
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull div7ansh/emotion-detection:v2
            docker stop emotion-detection || true
            docker rm emotion-detection || true
            docker run -d \
              --name emotion-detection \
              -p 5000:5000 \
              -e DAGSHUB_USERNAME="${{ secrets.DAGSHUB_USERNAME }}" \
              -e DAGSHUB_PAT="${{ secrets.DAGSHUB_PAT }}" \
              div7ansh/emotion-detection:v2